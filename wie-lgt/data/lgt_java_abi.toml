[[class]]
# gc is confirmed by call sites in six LGT titles (39 `Runtime.getRuntime().gc()` sites in one of them).
# freeMemory/totalMemory follow the CLDC declaration order (exit, freeMemory, totalMemory, gc) and are not
# confirmed yet; index 10 (exit) is deliberately left unmapped so a misprediction cannot terminate the app.
